[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agent-proctor"
dynamic = ["version"]
description = "The exam proctor for AI coding agents: catch agents that game their tests, and measure whether their code generalizes to tests they never saw."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Naveen Nair" }]
keywords = ["ai-agents", "coding-agents", "reward-hacking", "testing", "claude-code", "llm", "ci", "code-review", "goodhart"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/nbn07/proctor"
Issues = "https://github.com/nbn07/proctor/issues"

[project.scripts]
proctor = "proctor.cli:main"

[tool.hatch.version]
path = "src/proctor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/proctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
